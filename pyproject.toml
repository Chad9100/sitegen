[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitegen"
version = "0.1.0"
description = "A small static site and blog generator for Markdown folders."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chad Mowlavie" }]
requires-python = ">=3.11"
dependencies = ["markdown"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitegen = ["themes/*.html", "themes/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
